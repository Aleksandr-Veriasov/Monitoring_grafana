global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          # имя сервиса, а не контейнера: backend проверяет Host и не принимает menu_bot_backend
          - backend:8000
        labels:
          service: backend
          container: menu_bot_backend
  - job_name: downloader
    metrics_path: /metrics
    static_configs:
      - targets:
          - menu_bot_downloader:8082
        labels:
          service: downloader
          container: menu_bot_downloader
  - job_name: telethon_worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - menu_bot_telethon_worker:8090
        labels:
          service: telethon_worker
          container: menu_bot_telethon_worker
  - job_name: bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - menu_bot_tgbot:8443
        labels:
          service: bot
          container: menu_bot_tgbot
  - job_name: moneybox
    metrics_path: /metrics
    static_configs:
      - targets:
          - moneybox:8000
        labels:
          service: moneybox
          container: moneybox-moneybox-1
  - job_name: node_exporter
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
